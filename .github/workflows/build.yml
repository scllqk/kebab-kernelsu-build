name: Build SukiSU-Ultra for OnePlus 8T

on:
  workflow_dispatch:
    inputs:
      lineage_version:
        description: 'LineageOS kernel branch'
        required: true
        default: 'lineage-23.2'
      sukisu_version:
        description: 'SukiSU-Ultra version'
        required: true
        default: 'v4.1.3'

permissions:
  contents: write

jobs:
  build:
    name: kebab / SukiSU-Ultra
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_REF: ${{ inputs.lineage_version || 'lineage-23.2' }}
      SUKISU_REF: ${{ inputs.sukisu_version || 'v4.1.3' }}
      CLANG_VERSION: clang-r563880c
      AOSP_TAG: android-16.0.0_r4
      KERNEL_DIR: /tmp/kebab-kernel
      OUT_DIR: /tmp/kebab-out
      TOOLCHAIN_DIR: /tmp/kebab-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install --no-install-recommends -y \
            bc bison build-essential ca-certificates curl device-tree-compiler \
            flex git libelf-dev libssl-dev lz4 python3 rsync unzip zip zstd

      - name: Fetch kernel source
        run: |
          git init "${KERNEL_DIR}"
          git -C "${KERNEL_DIR}" remote add origin \
            https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
          git -C "${KERNEL_DIR}" fetch --depth=1 origin "${KERNEL_REF}"
          git -C "${KERNEL_DIR}" checkout --detach FETCH_HEAD

      - name: Install mkbootimg
        run: |
          if [ -f "${KERNEL_DIR}/scripts/mkbootimg/mkbootimg.py" ]; then
            sudo cp "${KERNEL_DIR}/scripts/mkbootimg/mkbootimg.py" /usr/local/bin/mkbootimg
            echo "Using kernel source mkbootimg"
          else
            git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
            sudo cp /tmp/mkbootimg/mkbootimg.py /usr/local/bin/mkbootimg
            echo "Using AOSP mkbootimg (kernel source didn't have it)"
          fi
          sudo chmod +x /usr/local/bin/mkbootimg
          mkbootimg --help 2>&1 | head -1

      - name: Fetch AOSP Clang toolchain
        run: |
          git clone --depth=1 --filter=blob:none --sparse --branch "${AOSP_TAG}" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${RUNNER_TEMP}/clang-prebuilts"
          git -C "${RUNNER_TEMP}/clang-prebuilts" sparse-checkout set "${CLANG_VERSION}"
          mv "${RUNNER_TEMP}/clang-prebuilts/${CLANG_VERSION}" "${TOOLCHAIN_DIR}"
          "${TOOLCHAIN_DIR}/bin/clang" --version

      - name: Build kernel
        run: bash scripts/build-kernel.sh

      - name: Package AnyKernel3
        run: bash scripts/package-anykernel.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kebab-sukisu-ultra-kpm
          path: dist/
          if-no-files-found: error
          retention-days: 30
